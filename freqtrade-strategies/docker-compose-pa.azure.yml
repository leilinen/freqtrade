services:
  price-action-1h:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.pa
    image: freqtrade-pa:latest
    container_name: price-action-1h
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /home/azureuser/freqtrade-develop/freqtrade-strategies/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/price_action_config_1h.json
      --strategy PriceActionMonitor
    networks:
      - pricedog_default

  price-action-4h:
    image: freqtrade-pa:latest
    container_name: price-action-4h
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /home/azureuser/freqtrade-develop/freqtrade-strategies/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/price_action_config_4h.json
      --strategy PriceActionMonitor
    networks:
      - pricedog_default

  ashare-1h:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: freqtrade-ashare:latest
    container_name: ashare-1h
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /home/azureuser/freqtrade-develop/freqtrade-strategies/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/price_action_config_ashare_1h.json
      --strategy PriceActionMonitor
    networks:
      - pricedog_default

  ashare-1d:
    image: freqtrade-ashare:latest
    container_name: ashare-1d
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /home/azureuser/freqtrade-develop/freqtrade-strategies/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/price_action_config_ashare_1d.json
      --strategy PriceActionMonitor
    networks:
      - pricedog_default

  tg-bot:
    image: freqtrade-tg-bot:latest
    container_name: freqtrade-tg-bot
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      TG_TOKEN: "8441181173:AAFK_tBevMSYZjxrTHYVsCRBur-C5KsyYgI"
      TG_CHAT_ID: "7724425342"
      DB_URL: "postgresql://postgres:postgres@postgres:5432/freqtrade_monitor"
      API_PORT: "8090"
    networks:
      - pricedog_default

networks:
  pricedog_default:
    external: true
