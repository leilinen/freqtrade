services:
  price-action-1h:
    image: freqtrade-pa:latest
    container_name: price-action-1h
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Users/lilin/Documents/code/ai/code/PriceDog/freqtrade/freqtrade-strategies/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/price_action_config_1h.json
      --strategy PriceActionMonitor
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os; [exit(0) for p in os.listdir('/proc') if p.isdigit() and 'freqtrade' in open(f'/proc/{p}/cmdline').read()] or exit(1)\""]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - panwatch_default

  price-action-4h:
    image: freqtrade-pa:latest
    container_name: price-action-4h
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Users/lilin/Documents/code/ai/code/PriceDog/freqtrade/freqtrade-strategies/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/price_action_config_4h.json
      --strategy PriceActionMonitor
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os; [exit(0) for p in os.listdir('/proc') if p.isdigit() and 'freqtrade' in open(f'/proc/{p}/cmdline').read()] or exit(1)\""]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - panwatch_default

  ashare-1h:
    build:
      context: ../../docker
      dockerfile: Dockerfile.ashare
    image: freqtrade-ashare:latest
    container_name: ashare-1h
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Users/lilin/Documents/code/ai/code/PriceDog/freqtrade/freqtrade-strategies/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/price_action_config_ashare_1h.json
      --strategy PriceActionMonitor
    networks:
      - panwatch_default

  ashare-1d:
    image: freqtrade-ashare:latest
    container_name: ashare-1d
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Users/lilin/Documents/code/ai/code/PriceDog/freqtrade/freqtrade-strategies/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/price_action_config_ashare_1d.json
      --strategy PriceActionMonitor
    networks:
      - panwatch_default

  tg-bot:
    build:
      context: .
      dockerfile: Dockerfile.tg
    image: freqtrade-tg-bot:latest
    container_name: freqtrade-tg-bot
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      TG_TOKEN: "8441181173:AAFK_tBevMSYZjxrTHYVsCRBur-C5KsyYgI"
      TG_CHAT_ID: "7724425342"
      DB_URL: "postgresql://postgres:postgres@postgres:5432/freqtrade_monitor"
      API_PORT: "8090"
    networks:
      - panwatch_default

networks:
  panwatch_default:
    external: true
